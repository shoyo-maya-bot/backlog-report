# 定期実行の例（GitHub Actions）. 使うときは .github/workflows/ にコピーし、リポジトリの Secrets に
# BACKLOG_API_KEY と SLACK_BOT_TOKEN を登録する。config.yaml の代わりに、この例では config.ci.yaml をコミットして使う。
#
# バーンダウンの実績（data/snapshots.csv）は、専用のブランチ report-data にコミットして残す（無料・期限なし）。
# Actions のキャッシュは 7 日使わないと消えるので、記録の置き場所には使わない。
# - report ジョブ: 毎日実行して残量を記録する（通知はしない）
# - save-snapshots ジョブ: 記録を report-data ブランチに保存する
# - notify ジョブ: 月曜（と手動実行のとき）だけ Slack と Wiki へ送る。通知が失敗しても、記録の保存には影響しない
# - リポジトリへの書き込み（contents: write）は、記録をコミットする save-snapshots ジョブだけに与える。
#   Backlog・Slack の秘密情報を使うジョブは読み取りだけ
# - 「今日」は BACKLOG_REPORT_TIMEZONE（日本時間）で決める。Actions の時計は UTC なので、OS の日付は使わない
# - actions はコミット SHA で固定し（本体の CI と同じ）、依存は constraints.txt で版を固定して入れる
name: progress-report

on:
  schedule:
    - cron: "50 23 * * *"   # 毎日 8:50（日本時間）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-report   # 記録のコミットが重ならないよう、同時には 1 つだけ動かす
  cancel-in-progress: false

env:
  BACKLOG_REPORT_TIMEZONE: Asia/Tokyo

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - run: pip install -e . -c constraints.txt
      # 前回までの記録を report-data ブランチから取り出す（初回はブランチが無いので空から始める）
      - name: restore snapshots
        run: |
          mkdir -p data
          if git fetch --depth=1 origin report-data; then
            git show FETCH_HEAD:snapshots.csv > data/snapshots.csv
          else
            echo "::notice::report-data ブランチがまだありません（初回）。記録を新しく作ります"
          fi
      - name: record（残量の記録とレポートのファイル. 通知はしない）
        run: backlog-report -c config.ci.yaml batch
        env:
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshots
          path: data/snapshots.csv
          if-no-files-found: error
          retention-days: 1   # 次のジョブへ渡すだけ. 保管は report-data ブランチ

  save-snapshots:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      contents: write   # report-data ブランチへの push だけに使う
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # report-data ブランチへ push するため（このジョブだけ）
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
      - name: commit snapshots to report-data
        run: |
          if git fetch --depth=1 origin report-data; then
            git switch -c report-data FETCH_HEAD
          else
            git switch --orphan report-data   # 初回: 履歴のない空のブランチを作る
          fi
          cp "$RUNNER_TEMP/snapshots/snapshots.csv" snapshots.csv
          git add snapshots.csv
          if git diff --cached --quiet; then
            echo "記録に変更はありません"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "data: バーンダウンの記録 $(TZ=Asia/Tokyo date +%F)"
          git push origin report-data

  # 通知は記録とは別のジョブ. Slack や Wiki が失敗しても、その日の記録は save-snapshots で残る
  notify:
    needs: report
    runs-on: ubuntu-latest
    steps:
      - name: 月曜（日本時間）か手動実行のときだけ送る
        id: when
        run: |
          if [ "$(TZ=Asia/Tokyo date +%u)" = 1 ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.when.outputs.send == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.when.outputs.send == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: steps.when.outputs.send == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk && pip install -e . -c constraints.txt
      # バーンダウンのグラフに今日までの記録を使う（記録はもう report ジョブで済んでいるので、ここでは足さない）
      - if: steps.when.outputs.send == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshots
          path: data
      - if: steps.when.outputs.send == 'true'
        name: notify
        run: backlog-report -c config.ci.yaml batch --no-snapshot --slack --wiki
        env:
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
