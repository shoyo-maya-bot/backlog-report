# backlog-report の設定. config.yaml にコピーして使う（config.yaml はコミットしない）.
# API キー・トークンはここに書かず .env に書く（.env.example を参照）.

backlog:
  space_url: https://example.backlog.com   # 自分のスペースの URL（.backlog.jp の場合もある）
  project_key: SAMPLE
  # mock_dir: samples/backlog             # 指定すると API を呼ばずにこのフォルダの JSON を読む（試行用）

report:
  done_statuses: [完了]          # 完了とみなす状態（処理済みも含めるなら [処理済み, 完了]）
  first_status: 未対応           # 未着手とみなす状態（「開始日を過ぎて未着手」とガントの色に使う。状態名を変えたプロジェクト向け）
  milestones: []                 # 対象のマイルストーン（空ならすべて）
  due_soon_days: 3               # 期限まで何日以内を「期限間近」とするか
  parent_child: children         # 完了率・バーンダウン・担当者別の残り時間の数え方: children（子課題で数える）/ parents（親課題で数える）/ both（両方）
  output_dir: output             # レポートとグラフの出力先
  snapshot_file: data/snapshots.csv   # バーンダウンの実績を記録するファイル（batch のたびに 1 行）
  timezone: Asia/Tokyo           # 「今日」と更新日時の日付を決めるタイムゾーン（環境変数 BACKLOG_REPORT_TIMEZONE が優先）
  # today: 2026-10-02            # 基準日を固定する（試行・テスト用）

slack:
  channel: ""                    # Bot トークンで投稿するときのチャンネル ID（例: C0123456789）
  post_log: data/posted.csv      # 送ったものの記録. 同じ日・同じ送り先には二度送らない（送り直すときは batch --force-post）
  allowed_users: []              # /progress を使える利用者の ID（例: [U0123456789]）。空なら制限しない
  allowed_channels: []           # /progress を使えるチャンネルの ID（例: [C0123456789]）。空なら制限しない

wiki:
  page: ""                       # 更新する Wiki ページ名（例: 進捗レポート/最新）。空なら更新しない
