[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backlog-report"
version = "0.1.0"
description = "Backlog の課題から進捗レポート（遅延・担当者別・ガント・バーンダウン）を作り、Slack と Backlog Wiki に届ける"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "devtools-common @ git+https://github.com/shoyo-maya-bot/devtools-common.git@61ca10f418b7176741cc7977f5971f69da63960d",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "tzdata>=2024.1; sys_platform == 'win32'",  # Windows にはタイムゾーンのデータが無い（zoneinfo で Asia/Tokyo を使う）
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
bot = ["slack_bolt>=1.18"]

[project.scripts]
backlog-report = "backlog_report.entrypoints.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]  # 長い条件は if 文のほうが読みやすい

[tool.ruff.lint.pycodestyle]
max-line-length = 180

[tool.pytest.ini_options]
testpaths = ["tests"]
