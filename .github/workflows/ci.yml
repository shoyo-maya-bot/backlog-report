name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Japanese fonts for charts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - run: pip install -e ".[dev,bot]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: bot module imports with slack_bolt
        run: python -c "import slack_bolt, backlog_report.entrypoints.slack_bot"
      - name: sample run (mock Backlog, no network)
        run: |
          python samples/make_samples.py
          backlog-report -c samples/config.yaml report
          backlog-report -c samples/config.yaml batch --wiki
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-report
          path: output/
